<!DOCTYPE html>
<!-- Vista para registrar compras y consultar sus registros. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Compras</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        .registro-medicamento {
            width: min(640px, calc(100% - 2rem));
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            border: 0;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 1rem 3rem #0004;
        }
        .registro-medicamento::backdrop { background: #0008; }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="inventario-lotes.css">
    <link rel="stylesheet" href="compras-flujo.css">
    <script src="navegacion.js" defer></script>
</head> 

<body data-module="compras" class="bg-light">
    <nav class="navbar navbar-dark bg-success px-4 py-3 shadow">
        <strong class="navbar-brand"><img class="logo-marca" src="assets/logo-farmajosue.png" alt=""> Farmacia Josué</strong>
        <span id="sessionUser" class="text-white"></span>
        <button
            id="logoutButton"
            class="btn btn-outline-light"
            type="button"
        >
            Cerrar sesión
        </button>
    </nav>

    <main class="container-fluid p-4">
        <div class="d-flex flex-wrap gap-2 mb-3">
            

        </div>

        <div class="compras-barra-superior">
            <h1 id="pageTitle">Compras</h1>
            <nav class="compras-accesos" aria-label="Inventarios de compras">
                <button id="irInventarioCompras" type="button" class="btn btn-outline-success" disabled>Ir a Inventario de Compras</button>
                <button id="verLotesRegistrados" type="button" class="btn btn-success" disabled>Inventario de Lotes</button>
            </nav>
        </div>
        <p id="pageDescription" class="text-secondary">Registro de compras de medicamentos a laboratorios.</p>
        <div id="message" class="alert d-none" role="alert"></div>

        <div id="vistaRegistroCompras">
        <div class="compras-area-trabajo mb-4">
        <div class="compras-layout">
        <aside class="compras-columna-informacion">
            <section id="comprasEncabezado" class="compras-encabezado" aria-label="Datos de la compra"></section>
            <section class="compras-lotes-agregados" aria-labelledby="lotesAgregadosTitulo">
                <h2 id="lotesAgregadosTitulo">Lotes agregados</h2>
                <div id="lotesAgregados" aria-live="polite"></div>
            </section>
        </aside>
        <section class="compras-formulario" aria-labelledby="comprasLotesTitulo">
            <div class="compras-seccion-titulo"><h2 id="comprasLotesTitulo">Registro de lotes</h2><p>Medicamentos, cantidades y precios de esta compra.</p></div>
            <form id="recordForm" class="row g-3"></form>
                <button
                    id="clearButton"
                    disabled
                    class="btn btn-secondary"
                    type="button"
                >
                    Limpiar
                </button>
        </section>
        <section class="compras-encabezado compras-pagos" aria-labelledby="comprasPagosTitulo">
            <h2 id="comprasPagosTitulo">Resumen y métodos de pago</h2>
            <div id="comprasResumen" class="compras-resumen"></div>
            <button id="saveButton" disabled form="recordForm" class="btn btn-light compras-guardar" type="submit">Guardar compra</button>
        </section>
        </div>
        </div>


        </div>
        <!-- Vista independiente: el formulario se conserva montado para mantener el borrador. -->
        <section id="vistaInventarioCompras" hidden aria-labelledby="historialComprasTitulo">
            <div class="card border-0 rounded-4 shadow-sm p-4">
                <div class="d-flex flex-wrap justify-content-between gap-3 mb-3">
                    <div><h2 id="historialComprasTitulo" tabindex="-1">Inventario de Compras</h2>
                    <p class="text-secondary mb-0">Historial general de compras y acceso a sus lotes.</p></div>
                    <button id="regresarRegistroCompras" type="button" class="btn btn-outline-success">Regresar a Compras</button>
                </div>
                <div id="historialComprasResumen" class="mb-3" role="status"></div>
                <div id="historialComprasTabla" class="table-responsive"></div>
            </div>
        </section>
        <!-- El componente de lotes se monta aqu? en modo p?gina, o en un dialog en modo modal. -->
        <section id="vistaInventarioLotes" class="inventario-lotes-pagina" hidden aria-label="Inventario de Lotes"></section>
    </main>

    <script src="./proveedores-ui.js"></script>
    <script src="./inventario-lotes.js"></script>
    <script src="./inventario-compras.js"></script>
    <script src="./tabla.js"></script>
</body>
</html>
