<!DOCTYPE html>
<!-- Vista para registrar compras y consultar sus registros. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Compras</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        .registro-medicamento {
            width: min(640px, calc(100% - 2rem));
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            border: 0;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 1rem 3rem #0004;
        }
        .registro-medicamento::backdrop { background: #0008; }
    </style>
</head> 

<body data-module="compras" class="bg-light">
    <nav class="navbar navbar-dark bg-success px-4 py-3 shadow">
        <strong class="navbar-brand">Farmacia Josue</strong>
        <span id="sessionUser" class="text-white"></span>
        <button
            id="logoutButton"
            class="btn btn-outline-light"
            type="button"
        >
            Cerrar sesión
        </button>
    </nav>

    <main class="container-fluid p-4">
        <div class="d-flex flex-wrap gap-2 mb-3">
            <button
                id="backButton"
                class="btn btn-outline-success"
                type="button"
            >
                ← Volver al menú
            </button>

        </div>

        <h1 id="pageTitle">Compras</h1>
        <p id="pageDescription" class="text-secondary">Registro de compras de medicamentos a laboratorios.</p>
        <p>Seleccioná un proveedor existente o ingresá sus datos para registrarlo junto con la compra.</p>
        <div id="message" class="alert d-none" role="alert"></div>

        <section class="card border-0 rounded-4 shadow-sm p-4 mb-4">
            <form id="recordForm" class="row g-3"></form>
            <div class="mt-3">
                <button
                    id="saveButton"
                    disabled
                    form="recordForm"
                    class="btn btn-success"
                    type="submit"
                >
                    Guardar compra
                </button>
                <button
                    id="clearButton"
                    disabled
                    class="btn btn-secondary"
                    type="button"
                >
                    Limpiar
                </button>
            </div>
        </section>

        <section class="card border-0 rounded-4 shadow-sm table-responsive">
            <h2 class="h5 p-3">Compras registradas</h2>
            <div id="tableContainer"></div>
        </section>
        <section id="lotesSection" class="card border-0 rounded-4 shadow-sm table-responsive p-3 mt-4" hidden>
            <h2 id="lotesTitle" class="h5">Lotes de la compra</h2>
            <div id="lotesContainer"></div>
        </section>
    </main>

    <script src="./tabla.js"></script>
</body>
</html>
