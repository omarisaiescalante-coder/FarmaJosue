<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Medicamentos | Farmacia Josue</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="medicamentos.css">
    <script src="medicamentos.js" defer></script>
    <script src="navegacion.js" defer></script>
</head>

<body data-module="medicamentos">

<header class="cabecera">
    <a href="index.html" class="nombre" aria-label="Farmacia Josué: ir al menú principal" title="Ir al menú principal">
        <img class="logo-marca" src="assets/logo-farmajosue.png" alt=""> Farmacia Josué
    </a>
    <button id="salir">
        Cerrar sesion
    </button>
</header>

<main class="contenido">


<p id="medicamentos-mensaje" role="status" aria-live="polite"></p>
<h1>Modulo de Medicamentos</h1>

<p>
Pasa el cursor sobre un medicamento para ver sus precios, lotes y vencimientos.
</p>

<section class="caja">
    <h2>Medicamentos disponibles</h2>
    <div id="tarjetero" class="tarjetero"></div>
</section>

<!-- FORMULARIO OCULTO -->
<section id="editarMedicamento" class="caja" hidden>
    <h2>Editar medicamento</h2>
    <form id="formEditar">
        <input type="hidden" id="id_medicamento">

        <label>
        Nombre
        <input id="nombre" required maxlength="150">
        </label>

        <label>
        Categoria
        <input id="categoria" maxlength="100">
        </label>

        <label>
        Restriccion
        <select id="restriccion">
            <option>Sin Receta Medica</option>
            <option>Con Receta Medica</option>
        </select>
        </label>

        <button type="submit">Guardar cambios</button>
        <button type="button" id="cancelar">Cancelar</button>
    </form>
</section>

</main>

</body>

</html>
