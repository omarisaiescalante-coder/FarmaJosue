<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
<title>Facturas | Farmacia Josué</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="facturas.css">
<script src="factura-documento.js" defer></script>
<script src="facturas-ui.js" defer></script>
    <script src="navegacion.js" defer></script>
</head>
<body data-module="facturas">
<header class="cabecera"><a href="index.html" class="nombre" aria-label="Ir al men&#250; principal" title="Ir al men&#250; principal"><img class="logo-marca" src="assets/logo-farmajosue.png" alt=""> Farmacia Josué</a><span id="sesion-nombre"></span><button id="salir" type="button">Cerrar sesión</button></header>
<main class="contenido">

<p id="facturas-mensaje" role="status" aria-live="polite">Verificando sesión...</p>
<section id="pagina-facturas" hidden>
<div class="controles-facturas"><h1>Facturas de venta</h1>
<label for="buscar-factura">Buscar por factura o DNI</label><input id="buscar-factura" type="search">
</div>
<div class="tabla-contenedor"><table><thead><tr><th>ID</th><th>Factura</th><th>DNI</th><th>Fecha</th><th>Estado</th><th>Total</th><th>Acciones</th></tr></thead><tbody id="facturas-filas"></tbody></table></div></div>
</section>
</main>
<dialog id="factura-detalle" aria-labelledby="factura-detalle-titulo">
    <header class="factura-modal-cabecera">
        <h2 id="factura-detalle-titulo">Detalle de factura</h2>
    </header>
    <div class="factura-modal-cuerpo">
        <div id="factura-documento" class="factura-documento"></div>
    </div>
    <footer class="factura-modal-acciones">
        <button id="cerrarFactura" type="button" autofocus>Cerrar</button>
        <button id="imprimir" type="button">Imprimir factura</button>
    </footer>
</dialog>
</body></html>
