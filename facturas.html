<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
<title>Facturas | Farmacia Josué</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="facturas.css">
<script src="facturas-ui.js" defer></script>
</head>
<body>
<header class="cabecera"><a href="index.html" class="nombre">Farmacia Josué</a><span id="sesion-nombre"></span><button id="salir" type="button">Cerrar sesión</button></header>
<main class="contenido">
<button id="volver-inicio" class="controles-facturas" type="button">← Volver al inicio</button>
<p id="facturas-mensaje" role="status" aria-live="polite">Verificando sesión...</p>
<section id="pagina-facturas" hidden>
<div class="controles-facturas"><a href="ventas.html">Registrar una venta</a><h1>Facturas de venta</h1>
<label for="buscar-factura">Buscar por factura o DNI</label><input id="buscar-factura" type="search"><button id="recargar-facturas" type="button">Actualizar lista</button>
<div class="tabla-contenedor"><table><thead><tr><th>Factura</th><th>DNI</th><th>Fecha</th><th>Estado</th><th>Total</th><th>Acciones</th></tr></thead><tbody id="facturas-filas"></tbody></table></div></div>
<section id="factura-detalle" class="caja" hidden><div id="factura-documento"></div><button id="imprimir" type="button">Imprimir factura</button></section>
</section>
</main>
</body></html>
